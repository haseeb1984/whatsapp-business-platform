name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_DB: whatsapp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whatsapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, bcmath, curl, xml
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction
      - name: Audit PHP dependencies
        run: composer audit --locked
      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate
      - name: Run PHP tests (SQLite)
        run: php artisan test
      - name: Verify SQLite migration rollback and replay
        run: |
          touch database/ci-migrations.sqlite
          DB_CONNECTION=sqlite DB_DATABASE=database/ci-migrations.sqlite php artisan migrate --force
          DB_CONNECTION=sqlite DB_DATABASE=database/ci-migrations.sqlite php artisan migrate:reset
          DB_CONNECTION=sqlite DB_DATABASE=database/ci-migrations.sqlite php artisan migrate --force
          rm database/ci-migrations.sqlite
      - name: Run PHP tests (PostgreSQL 16)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: whatsapp_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_SSLMODE: disable
        run: php artisan test
      - name: Verify PostgreSQL migration rollback and replay
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: whatsapp_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_SSLMODE: disable
        run: php artisan migrate:reset && php artisan migrate --force
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend production dependencies
        run: npm audit --omit=dev
      - name: Build frontend
        run: npm run build
      - name: Verify route-level page chunks
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('public/build/manifest.json', 'utf8'));
          const entry = manifest['resources/js/app.tsx'];
          const pageChunks = Object.keys(manifest).filter((key) => key.startsWith('resources/js/Pages/'));
          if (!entry?.dynamicImports?.length || pageChunks.length === 0) {
            throw new Error('Inertia pages are not being emitted as lazy-loaded route chunks.');
          }
          console.log(`Verified ${pageChunks.length} lazy-loaded Inertia page chunks.`);
          NODE
