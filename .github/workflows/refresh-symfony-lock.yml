name: Refresh patched Symfony lockfile

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Update patched Symfony components
        run: composer update symfony/http-kernel symfony/mailer symfony/routing --with-all-dependencies --no-interaction --prefer-dist
      - name: Audit updated dependencies
        run: composer audit --locked
      - name: Commit refreshed lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          if git diff --cached --quiet; then
            echo 'Composer lockfile already current'
          else
            git commit -m 'Update patched Symfony security dependencies'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
